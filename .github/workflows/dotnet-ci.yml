name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # This review branch defers restore/build/test until the reviewed integration phase.
    # A skipped job is not evidence of a passed or zero-test suite.
    if: github.ref != 'refs/heads/test/issue-6-contract-regression' && github.head_ref != 'test/issue-6-contract-regression'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./roidoya-character-platform.sln

      - name: Build (Release)
        run: dotnet build ./roidoya-character-platform.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test ./roidoya-character-platform.sln --configuration Release --no-build --logger "console;verbosity=normal"
