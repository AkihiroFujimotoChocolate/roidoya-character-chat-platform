name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./roidoya-character-platform.sln -p:EnablePhase2GatewayTests=true

      - name: Build (Release)
        run: dotnet build ./roidoya-character-platform.sln --configuration Release --no-restore -p:EnablePhase2GatewayTests=true

      - name: Test (Release)
        run: dotnet test ./roidoya-character-platform.sln --configuration Release --no-build -p:EnablePhase2GatewayTests=true --logger "console;verbosity=normal"
